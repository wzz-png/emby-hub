name: emby_hub
description: A premium cross-platform Emby media player with iOS-style glassmorphism design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1

  # Player
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_macos_video: ^1.1.4
  video_player: ^2.9.2
  fvp: ^0.36.1
  flutter_vlc_player: ^7.4.4

  # Storage
  flutter_secure_storage: ^9.2.2

  # Images
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.2

  # UI / Animation
  flutter_animate: ^4.5.0

  # Desktop
  window_manager: ^0.3.9

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.3
  url_launcher: ^6.2.6
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
